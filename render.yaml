services:
  - type: web
    name: sendiasporaa-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: app_notas
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
